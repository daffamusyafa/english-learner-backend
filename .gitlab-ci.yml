stages:
  - build

variables:
  # Nama image Anda di Docker Hub
  DOCKERHUB_IMAGE: "daffamusyafa/english-learner-backend"

build_and_push_to_dockerhub:
  stage: build
  
  # Menyediakan 'docker' CLI
  image: docker:20.10
  # Menjalankan 'docker' engine (daemon)
  services:
    - docker:20.10-dind
    
  variables:
    # Memberi tahu 'docker' CLI di mana menemukan 'docker' engine
    DOCKER_HOST: tcp://docker:2375
    # Menonaktifkan enkripsi (TLS)
    DOCKER_TLS_CERTDIR: ""
    # Membuat tag versi otomatis, misal: "v1.71"
    VERSION_TAG: "v1.$CI_PIPELINE_IID"

  # Dikomentari agar runner Anda bisa mengambil job
  # tags:
  #   - docker 

  # Pastikan 'script:' memiliki indentasi yang benar (2 spasi)
  script:
    - echo "Logging in to Docker Hub..."
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
    - echo "Building image with tag: $VERSION_TAG"
    # Menggunakan tag versi otomatis
    - docker build -t $DOCKERHUB_IMAGE:$VERSION_TAG .
    - echo "Creating 'latest' tag..."
    - docker tag $DOCKERHUB_IMAGE:$VERSION_TAG $DOCKERHUB_IMAGE:latest
    - echo "Pushing image to Docker Hub..."
    # Push tag versi otomatis
    - docker push $DOCKERHUB_IMAGE:$VERSION_TAG
    # Push tag 'latest'
    - docker push $DOCKERHUB_IMAGE:latest
    
  only:
    - master