build_backend:
  stage: build
  tags:
    - docker # Pastikan runner Anda memiliki tag ini
  variables:
    # Tentukan nama image Anda di Docker Hub
    # Format: <username-dockerhub>/<nama-image-repo>
    DOCKERHUB_IMAGE: "daffa-student/english-learner-backend" 
  script:
    - echo "Logging in to Docker Hub..."
    # 1. Login ke DOCKER HUB menggunakan variabel yang baru dibuat
    # Jangan sertakan $CI_REGISTRY di sini
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_TOKEN
    
    - echo "Building backend Docker image..."
    # 2. Build dan TAG image dengan format Docker Hub
    - docker build -t $DOCKERHUB_IMAGE:$CI_COMMIT_SHA .
    # (Opsional) Buat juga tag 'latest'
    - docker tag $DOCKERHUB_IMAGE:$CI_COMMIT_SHA $DOCKERHUB_IMAGE:latest
    
    - echo "Pushing image to Docker Hub..."
    # 3. Push image ke DOCKER HUB
    - docker push $DOCKERHUB_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKERHUB_IMAGE:latest