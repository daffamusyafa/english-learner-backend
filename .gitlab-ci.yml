stages:
  - build

variables:
  # Ganti 'your-group/your-project/backend' dengan path registry Anda
  IMAGE_TAG_BACKEND: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA

build_backend:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - echo "Building backend Docker image..."
    # Login ke GitLab Container Registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Build image
    # Kita set JWT_SECRET sebagai build argument agar bisa digunakan saat build
    # Pastikan JWT_SECRET ada di GitLab CI/CD Variables
    - |
      docker build \
        --build-arg JWT_SECRET=${JWT_SECRET} \
        -t $IMAGE_TAG_BACKEND .
    # Push image ke registry
    - docker push $IMAGE_TAG_BACKEND
